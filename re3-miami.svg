<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- neon-tube letters: outline only, glowing cyan with a magenta inner line -->
  <text x="250" y="240" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="190" fill="none" stroke="#ff4fd8" stroke-width="18" stroke-linejoin="round" filter="url(#glow)">RE3</text>
  <text x="250" y="240" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="190" fill="none" stroke="#7ff7ff" stroke-width="5" stroke-linejoin="round">RE3</text>
  <!-- flat pink plate with dark caption -->
  <rect x="120" y="282" width="260" height="46" rx="6" fill="#ff4fd8" stroke="#1a0b3a" stroke-width="6"/>
  <text x="250" y="317" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="32" font-weight="900" fill="#1a0b3a" letter-spacing="8">MIAMI</text>
  <!-- thin horizon lines -->
  <rect x="60" y="346" width="380" height="4" fill="#7ff7ff"/>
  <rect x="100" y="358" width="300" height="3" fill="#ff4fd8"/>
</svg>
